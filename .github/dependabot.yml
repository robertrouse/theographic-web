# Security updates only, batched into one PR per run.
# open-pull-requests-limit: 0 turns off routine version-bump PRs;
# security updates ignore that limit and use the `security` group.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
