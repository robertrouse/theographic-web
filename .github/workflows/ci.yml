name: CI

on:
  push:
    branches: [master, v2, 'cp-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Cache metadata source files
        uses: actions/cache@v4
        with:
          path: packages/data/.cache
          key: metadata-${{ hashFiles('packages/data/data.lock') }}
      - run: npm run data
      - run: npm run build
      - name: Bundle size budget
        run: node scripts/size-budget.mjs
